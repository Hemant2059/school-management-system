# School Management System - Render Blueprint

services:
  - type: web
    name: sms-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: DB_HOST
        value: # TODO: Add your PostgreSQL internal hostname
      - key: DB_PORT
        value: '5432'
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        value: # TODO: Add your PostgreSQL password
      - key: DB_NAME
        value: # TODO: Add your PostgreSQL database name
      - key: REDIS_HOST
        value: redis-10110.crce276.ap-south-1-3.ec2.cloud.redislabs.com
      - key: REDIS_PORT
        value: '10110'
      - key: REDIS_PASSWORD
        value: JjSiK5di1qGWjSiL4EPvSJuQkh6t5SBw
      - key: JWT_SECRET
        value: your-super-secure-jwt-secret-min-32-chars
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_SECRET
        value: your-refresh-secret-min-32-chars
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: TIMEZONE
        value: Asia/Kathmandu
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: 'false'
