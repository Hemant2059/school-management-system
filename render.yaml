# School Management System - Render Blueprint
#
# Deploy steps:
# 1. Create PostgreSQL manually: Dashboard → New → PostgreSQL
# 2. Create Redis manually: Dashboard → New → Redis
# 3. Use this blueprint

services:
  - type: web
    name: sms-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: DB_HOST
        value: # TODO: Add your PostgreSQL internal hostname
      - key: DB_PORT
        value: '5432'
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        value: # TODO: Add your PostgreSQL password
      - key: DB_NAME
        value: # TODO: Add your PostgreSQL database name
      - key: REDIS_HOST
        value: # TODO: Add your Redis internal hostname
      - key: REDIS_PORT
        value: '6379'
      - key: JWT_SECRET
        value: your-super-secure-jwt-secret-min-32-chars
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_SECRET
        value: your-refresh-secret-min-32-chars
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: TIMEZONE
        value: Asia/Kathmandu
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: 'false'
