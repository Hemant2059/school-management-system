services:
  # PostgreSQL Database
  - type: database
    name: sms-postgres
    plan: free
    postgresVersion: 16
    region: oregon

  # Redis Cache
  - type: redis
    name: sms-redis
    plan: free
    region: oregon

  # NestJS API
  - type: web
    name: sms-api
    env: docker
    region: oregon
    dockerCommand: docker build -t sms-api . && docker run -p 3001:3001 sms-api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_HOST
        fromDatabase:
          name: sms-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sms-postgres
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: sms-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sms-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: sms-postgres
          property: database
      - key: DB_SCHEMA
        value: public
      - key: DB_SSL
        value: 'false'
      - key: DB_POOL_MAX
        value: '20'
      - key: DB_POOL_MIN
        value: '5'
      - key: REDIS_HOST
        fromRedis:
          name: sms-redis
          property: host
      - key: REDIS_PORT
        fromRedis:
          name: sms-redis
          property: port
      - key: REDIS_TTL
        value: '3600'
      - key: JWT_SECRET
        value: your-super-secure-jwt-secret-min-32-chars
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_SECRET
        value: your-refresh-secret-min-32-chars
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: TIMEZONE
        value: Asia/Kathmandu
      - key: DEFAULT_LANGUAGE
        value: ne
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: ENCRYPTION_KEY
        value: your_32_character_encryption_key_
      - key: ENCRYPTION_IV
        value: your_16_character_iv
      - key: FRONTEND_URL
        value: https://your-domain.com
      - key: UPLOAD_PATH
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: '10485760'
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: RATE_LIMIT_ENABLED
        value: 'true'
      - key: APP_URL
        value: https://sms-api.onrender.com
